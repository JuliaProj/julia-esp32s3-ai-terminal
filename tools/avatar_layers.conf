[source]
base = main/ui/generated/julia_reference_ui.png
blink_half = file/ui_animation/standby/blink_00_open.png
blink_closed = file/ui_animation/standby/blink_01_closed.png
mouth_closed = file/ui_animation/standby/mouth_00_closed.png
mouth_half = file/ui_animation/standby/mouth_02_medium.png
mouth_open = file/ui_animation/standby/mouth_03_wide.png
output = main/ui/generated/avatar_layers

# Rectangles are x,y,width,height in the 360x360 display coordinate system.
[layers]
eye_left = 112,108,55,58
eye_right = 194,108,55,58
pupil_left = 132,119,27,32
pupil_right = 204,119,27,32
mouth = 153,177,54,34
hair_tip = 73,184,34,52

[pupil]
# Elliptical alpha inset avoids moving a rectangular copy of the eye whites.
alpha_inset = 2

[options]
hair_tip = false

